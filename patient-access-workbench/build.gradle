plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.7'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.thehiddenbrain.interop'
version = '1.0.0'
description = 'Test workbench for a payer\'s CMS-9115-F / CMS-0057-F Patient Access API (FHIR R4: CARIN Blue Button, Da Vinci PDex incl. prior authorization, US Core, SMART App Launch) against vendor environments'

// No toolchain block on purpose: release 17 pins source, target, and the linked API in one
// flag on whatever JVM builds (JDK 17, 21 or 25 all work).
tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.encoding = 'UTF-8'
    // Spring Framework 7 resolves @PathVariable and @RequestParam by reflection and
    // needs parameter names in the bytecode; bindings carry explicit names anyway.
    options.compilerArgs.add('-parameters')
}

ext {
    hapiVersion = '8.12.1'
    nimbusVersion = '10.9.1'
    springdocVersion = '3.0.3'
    wiremockVersion = '3.13.1'
}

repositories {
    if (project.hasProperty('internalRepoUrl')) {
        maven { url = project.property('internalRepoUrl') }
    } else {
        mavenCentral()
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-restclient'
    implementation 'org.springframework.boot:spring-boot-starter-jackson'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    // Spring Boot 4 ships Jackson 3: tools.jackson groups for databind and formats.
    implementation 'tools.jackson.dataformat:jackson-dataformat-yaml'

    // FHIR R4 model, parsers and FHIRPath; the validation module also provides the optional full profile validator
    implementation "ca.uhn.hapi.fhir:hapi-fhir-base:${hapiVersion}"
    implementation "ca.uhn.hapi.fhir:hapi-fhir-structures-r4:${hapiVersion}"
    implementation "ca.uhn.hapi.fhir:hapi-fhir-validation:${hapiVersion}"
    implementation "ca.uhn.hapi.fhir:hapi-fhir-validation-resources-r4:${hapiVersion}"
    // cache implementation the validation support chain needs
    implementation "ca.uhn.hapi.fhir:hapi-fhir-caching-caffeine:${hapiVersion}"

    // JWT client assertions for SMART Backend Services and id_token inspection
    implementation "com.nimbusds:nimbus-jose-jwt:${nimbusVersion}"

    implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:${springdocVersion}"

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation "org.wiremock:wiremock-standalone:${wiremockVersion}"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Stamps the build so the running app can prove which version it is (/actuator/info, /api/about).
springBoot {
    buildInfo()
}

bootJar {
    archiveFileName = "patient-access-workbench-${project.version}.jar"
}

test {
    useJUnitPlatform()
    maxHeapSize = '1g'
    testLogging { events 'failed'; exceptionFormat = 'full' }
}
