# Developer profile (default): no network, in-process MMI stub with the fixtures in mmi-stub/members.json.
mmi:
  base-url: http://mmi-stub.local
  stub:
    enabled: true
  log-payloads: ${MMI_LOG_PAYLOADS:true}                    # show the exact MMI request and response in the console
logging:
  level:
    org.point32health.memberid: DEBUG
