# Production: the shared drive is mounted on the host. Override with environment
# variables (CMS1500_ATTACHMENTS_DIR / CMS1500_OUTPUT_DIR) or edit the paths here.
cms1500:
  attachments:
    root: ${CMS1500_ATTACHMENTS_DIR:/mnt/claims/attachments}
  output:
    root: ${CMS1500_OUTPUT_DIR:/mnt/claims/bundles}
  settings-file: ${CMS1500_SETTINGS_FILE:/mnt/claims/config/cms1500-settings.json}
  ui:
    enabled: ${CMS1500_UI_ENABLED:false}

springdoc:
  swagger-ui:
    enabled: false

logging:
  level:
    com.thehiddenbrain.interop.cms1500: INFO
