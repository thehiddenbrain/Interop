<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Scripts, styles and data load from this tool only. A vendor response is untrusted text: if a
     piece of it ever reached the page as markup, this is what stops it running or calling out.
     The server sends the same policy as a header; this copy covers a page opened any other way. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>PAVE</title>
<link rel="icon" type="image/svg+xml" href="img/pave.svg">
<link rel="stylesheet" href="css/pave.css">
<link rel="stylesheet" href="css/case.css">
<link rel="stylesheet" href="css/config.css">
<link rel="stylesheet" href="css/history.css">
<link rel="stylesheet" href="css/pas.css">
<link rel="stylesheet" href="css/dtr.css">
<link rel="stylesheet" href="css/crd-compare.css">
<script type="module" src="js/app.js"></script>
</head>
<body>
<a class="skip-link" href="#main">Skip to the working area</a>

<header class="masthead">
  <p class="masthead__identity">
    <span class="masthead__name" id="tool-name">PAVE</span>
    <span class="masthead__version" id="tool-version"></span>
  </p>
  <div class="masthead__strip" id="environment-strip" aria-live="polite" aria-label="Where this tool is pointed"></div>
</header>

<div id="banners" aria-live="polite"></div>

<div class="tab-row">
  <div class="tabs" id="tabs" role="tablist" aria-label="Sections of the tool"></div>
  <button type="button" class="button button--quiet button--small" id="legend-open" aria-haspopup="dialog">Colour key</button>
</div>

<div id="notices" role="status" aria-live="polite"></div>
<div id="chain-bar" aria-live="polite" hidden></div>

<main id="main" tabindex="-1">
  <noscript>
    <p class="plain-statement">PAVE needs JavaScript to run. Its scripts are loaded from this tool only, never from another site.</p>
  </noscript>
</main>

<dialog id="legend" class="legend" aria-labelledby="legend-title"></dialog>
</body>
</html>
