# Gradle 9.5 and Spring Boot 4 need a JDK 17 or newer to run the build. When the java on your PATH
# (or JAVA_HOME) is older, either run run.bat (it finds a JDK 17+ by itself), set JAVA_HOME before
# calling gradlew, or uncomment the line below with your JDK folder (forward slashes are fine).
# Keep machine-specific paths out of git: putting this line in %USERPROFILE%\.gradle\gradle.properties
# instead applies it to every Gradle build on the machine.
#org.gradle.java.home=C:/Program Files/Eclipse Adoptium/jdk-17.0.9-hotspot
org.gradle.jvmargs=-Xmx1g -Dfile.encoding=UTF-8
