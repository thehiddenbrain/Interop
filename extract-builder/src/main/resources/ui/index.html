<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vendor Extract Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" media="print" onload="this.media='all'">
<link rel="stylesheet" href="app.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230E7C74'/%3E%3Cpath d='M8 10h16M8 16h10M8 22h13' stroke='%23fff' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
</head>
<body>
<div id="app" class="app">
  <aside class="sidebar" id="sidebar">
    <a class="brand" href="#/">
      <span class="brand-mark" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M4 6h16M4 12h10M4 18h13"/></svg></span>
      <span class="brand-text">Vendor Extract<br><b>Builder</b></span>
    </a>
    <nav class="nav" id="nav" aria-label="Main"></nav>
    <div class="sidebar-foot">
      <button class="theme-toggle" id="themeToggle" type="button" title="Switch theme"><span class="ico" id="themeIcon"></span><span>Theme</span></button>
      <div class="sidebar-version">demo build · engine 1.0.0</div>
    </div>
  </aside>
  <div class="main">
    <header class="topbar">
      <button class="icon-btn menu-btn" id="menuBtn" type="button" aria-label="Toggle navigation"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <div class="crumbs" id="crumbs"></div>
      <div class="topbar-spacer"></div>
      <div class="topbar-actions">
        <button class="icon-btn" id="bellBtn" type="button" aria-label="Notifications"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"/></svg><span class="bell-dot" id="bellDot" hidden></span></button>
        <div class="user-switch" id="userSwitch"></div>
      </div>
    </header>
    <main class="content" id="content" tabindex="-1"></main>
  </div>
</div>
<div id="drawer" class="drawer" hidden></div>
<div id="modal" class="modal-root" hidden></div>
<div id="toasts" class="toasts" aria-live="polite"></div>
<script src="app.js"></script>
<script src="pages/dashboard.js"></script>
<script src="pages/definitions.js"></script>
<script src="pages/builder.js"></script>
<script src="pages/run.js"></script>
<script src="pages/approvals.js"></script>
<script src="pages/productionalize.js"></script>
<script src="pages/runs.js"></script>
<script src="pages/partners.js"></script>
<script src="pages/catalog.js"></script>
<script src="pages/compliance.js"></script>
<script src="pages/audit.js"></script>
<script src="pages/importer.js"></script>
<script src="pages/feedapi.js"></script>
<script src="pages/settings.js"></script>
<script>App.start();</script>
</body>
</html>
