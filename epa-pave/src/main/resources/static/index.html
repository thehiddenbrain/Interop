<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Scripts, styles and data load from this tool only. A vendor response is untrusted text: if a
     piece of it ever reached the page as markup, this is what stops it running or calling out.
     The server sends the same policy as a header; this copy covers a page opened any other way. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>PAVE</title>
<link rel="icon" type="image/svg+xml" href="img/pave.svg">
<link rel="stylesheet" href="css/pave.css">
<link rel="stylesheet" href="css/workbench.css">
<link rel="stylesheet" href="css/audit.css">
<link rel="stylesheet" href="css/config.css">
<script type="module" src="js/app.js"></script>
</head>
<body>
<a class="skip-link" href="#main">Skip to the working area</a>

<header class="topbar" id="topbar">
  <a class="topbar__brand" href="#workbench">Point32Health<span class="topbar__product" id="tool-name">PAVE</span></a>
  <nav class="tabs" id="tabs" aria-label="Sections of the tool">
    <a class="tabs__tab" href="#workbench" data-tab="workbench">Workbench</a>
    <a class="tabs__tab" href="#audit" data-tab="audit">Audit<span class="tabs__count" id="audit-count" hidden></span></a>
    <a class="tabs__tab" href="#configuration" data-tab="configuration">Configuration</a>
  </nav>
  <div class="topbar__end">
    <div class="topbar__env">
      <label for="environment">Environment</label>
      <select class="select" id="environment" disabled></select>
      <span class="badge" id="kind" title="Kind of environment, as stated when it was stored" hidden></span>
    </div>
    <span class="badge" id="profile" hidden></span>
    <span class="topbar__signin" id="sign-in" hidden></span>
    <span class="topbar__stamp mono" id="stamp" hidden></span>
  </div>
</header>

<div class="lines">
  <div id="line-environment"></div>
  <div class="lines__boxed">
    <div id="line-ledger" aria-live="polite"></div>
    <div id="line-notice" role="status" aria-live="polite"></div>
  </div>
</div>
<p class="visually-hidden" id="frame-news" role="status" aria-live="polite"></p>

<main id="main" class="main" tabindex="-1">
  <noscript>
    <p class="stub-line">PAVE needs JavaScript to run. Its scripts are loaded from this tool only, never from another site.</p>
  </noscript>
</main>
</body>
</html>
