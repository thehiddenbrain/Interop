spring:
  application:
    name: member-id-resolution-service
  profiles:
    default: pqa                        # "Run As > Spring Boot App" in STS with no profile talks to the PQA MMI; Profile = dev for the in-process stub
  jackson:
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: true  # a misspelled Onyx property is an error, not silently ignored
  mvc:
    problemdetails:
      enabled: false                    # the error envelope in ApiErrorResponse is the only error shape

server:
  port: 9090
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  info:
    build:
      enabled: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{correlationId:-}] %logger{36} - %msg%n"

mmi:
  base-url: ${MMI_BASE_URL:}            # set per profile (application-<env>.yml) or by environment variable
  path: /master/member/v1
  client-id: ${MMI_CLIENT_ID:MBRIDSVC}  # PLACEHOLDER: register this application's name with the MMI team
  client-type: INT
  connect-timeout: ${MMI_CONNECT_TIMEOUT:2s}
  read-timeout: ${MMI_READ_TIMEOUT:5s}
  void-coverage-record: N               # MMI drops void and negative spans; the service also skips voidFlag=Y
  error-message-types: [ERROR]          # messageType values MMI uses for errors in a 200 envelope
  # MMI's HTTP contract and how this service answers (fixed in RestMmiClient, not configurable):
  #   200 -> outcome from the records      404 (no member) -> 200 NOT_FOUND
  #   400 (bad request) -> 400 MMI_BAD_REQUEST with MMI's text      500 (internal error) -> 503 MMI_UNAVAILABLE
  #   anything else is a gateway or proxy, not MMI: 503 (5xx/429/408) or 502
  log-payloads: ${MMI_LOG_PAYLOADS:false}  # print the full MMI request and response bodies (PHI); dev/fqa/pqa/pqa-lite turn it on
  stub:
    enabled: false                      # true only in the dev and test profiles

member-id:
  date-of-service:
    max-past-years: 10                  # MMI keeps 10 years of coverage history; no upper limit: a future date is judged on the coverage on record
    zone: America/New_York              # "today" for a defaulted date of service
  date-of-birth-max-age-years: 125
  # ------------------------------------------------------------------------------------------------------
  # Vendor -> format table. This is the ONLY place to add or change a vendor. Key = the code Onyx sends.
  # Formats apply to THP ids stored as 9 digits + spaces + 2-digit suffix (TMP / SCO). Public Plans ids
  # (11 continuous characters) and HPHC ids (HP + digits) are sent exactly as stored for every vendor.
  # The INCOMING member id is never checked or reshaped: it goes to MMI exactly as the EMR typed it.
  #   COMPACT_11  9 digits + suffix, no spaces        12345678901
  #   SPACED_14   9 digits + 3 spaces + suffix        123456789   01   (as stored)
  #   SPLIT       two fields: 9 digits and the suffix, plus the 11-character join
  #   AS_STORED   exactly as MMI stores it
  # ------------------------------------------------------------------------------------------------------
  vendors:
    EVICORE:
      display-name: eviCore
      aliases: [EVI, EVICORE_HEALTHCARE]
      format: COMPACT_11
    MHK:
      display-name: MHK (MedHOK)
      aliases: [MEDHOK]
      format: SPACED_14
    EVOLENT:
      display-name: Evolent
      aliases: [EVOLENT_HEALTH]
      format: COMPACT_11
    CARELON:
      display-name: Carelon
      aliases: [AIM]
      format: COMPACT_11
    OPTUM:
      display-name: Optum
      format: SPLIT                     # Optum receives the 9 digits and the suffix as two fields
    ONYX:
      display-name: Onyx
      format: COMPACT_11
