spring:
  datasource:
    url: jdbc:h2:mem:coverage-${random.uuid};DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
  sql:
    init:
      mode: always
      schema-locations: classpath:coverage-dev/schema.sql
      data-locations: classpath:coverage-dev/data.sql
mmi:
  base-url: http://mmi-stub.test
  stub:
    enabled: true
  log-payloads: false
member-info:
  base-url: http://member-info-stub.test
  stub:
    enabled: true
  log-payloads: false
logging:
  level:
    org.p32h.interop: DEBUG
